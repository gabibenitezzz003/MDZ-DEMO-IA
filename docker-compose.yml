services:
  demo:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://demo-agricultura.tuempresa.com}
        NEXT_PUBLIC_USE_DOGRAH: ${NEXT_PUBLIC_USE_DOGRAH:-false}
    image: demo-agricultura:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SPEACHES_URL: ${SPEACHES_DOCKER_URL:-http://host.docker.internal:8771}
      N8N_WEBHOOK_URL: ${N8N_DOCKER_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/demo-agricultura}
      N8N_BASE_URL: ${N8N_DOCKER_BASE_URL:-http://host.docker.internal:5678}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Solo localhost: nginx (o el reverse proxy) habla con el mundo
      - "127.0.0.1:3000:3000"
    # Una sola réplica: la memoria de chat/SSE vive en proceso
    deploy:
      replicas: 1
