# Ejemplo nginx — reemplazá demo-agricultura.tuempresa.com
# SSL con certbot: certbot --nginx -d demo-agricultura.tuempresa.com

upstream demo_agricultura {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name demo-agricultura.tuempresa.com;

    # Redirect HTTP → HTTPS (después de tener certificado)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://demo_agricultura;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        # SSE (/api/agent/events) necesita buffering off
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

